name: leas-credentials

# The expiry watch.
#
# Distribution certificates last three years and provisioning profiles one.
# That is long enough that nobody remembers and short enough that everybody is
# eventually caught, so the only reliable reminder is a scheduled one. This job
# reads the expiry dates out of your own secrets and opens an issue before the
# date arrives — and closes it again once you have renewed.

on:
  schedule:
    - cron: '0 14 * * 1'   # Mondays, 14:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: Warn this many days ahead
        type: string
        default: '30'

permissions:
  contents: read
  issues: write

jobs:
  check:
    # Linux is enough. leas falls back to openssl for the provisioning profile
    # when macOS's `security` is absent, so this does not need a rented Mac.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }

      - run: npm ci

      - name: Read credential expiry
        id: scan
        env:
          DAYS: ${{ inputs.days || '30' }}
          LEAS_IOS_DIST_CERT_BASE64: ${{ secrets.LEAS_IOS_DIST_CERT_BASE64 }}
          LEAS_IOS_DIST_CERT_PASSWORD: ${{ secrets.LEAS_IOS_DIST_CERT_PASSWORD }}
          LEAS_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.LEAS_IOS_PROVISIONING_PROFILE_BASE64 }}
          LEAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.LEAS_ANDROID_KEYSTORE_BASE64 }}
          LEAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LEAS_ANDROID_KEYSTORE_PASSWORD }}
          LEAS_ANDROID_KEY_ALIAS: ${{ secrets.LEAS_ANDROID_KEY_ALIAS }}
        run: |
          npx leas creds --days "$DAYS" || true          # readable in the run log
          npx leas creds --days "$DAYS" --json > creds.json
          node --input-type=module -e '
            import { readFileSync, writeFileSync, appendFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("creds.json", "utf8"));
            const bad = r.credentials.filter((c) => c.status === "expired" || c.status === "expiring");
            appendFileSync(process.env.GITHUB_OUTPUT, `attention=${bad.length}\n`);
            const line = (c) => `- **${c.kind}** (${c.platform}) — ` + (c.status === "expired"
              ? `**expired ${c.expires.slice(0, 10)}**`
              : `expires ${c.expires.slice(0, 10)}, in ${c.daysLeft} days`)
              + (c.identity ? `\n  \`${c.identity}\`` : "");
            writeFileSync("issue.md", [
              `${bad.length} signing credential${bad.length === 1 ? " needs" : "s need"} attention.`, "",
              ...bad.map(line), "",
              "Renewal runbooks are in section 8 of the manual. After renewing, update the",
              "matching repository secret and this issue will close itself on the next run.", "",
              `_Checked ${r.generatedAt.slice(0, 10)} · window ${r.warnDays} days._`,
            ].join("\n"));
          '

      - name: Open or update the issue
        if: steps.scan.outputs.attention != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create leas-credentials --color D93F0B \
            --description "Signing material approaching expiry" 2>/dev/null || true
          NUM=$(gh issue list --label leas-credentials --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file issue.md
          else
            gh issue create --title "Signing credentials need attention" \
              --label leas-credentials --body-file issue.md
          fi

      - name: Close the issue once everything is renewed
        if: steps.scan.outputs.attention == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --label leas-credentials --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "All signing credentials are valid again."
          fi
